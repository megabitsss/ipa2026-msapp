<html>
<head>
    <title>Sample app</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
    <h1>Register Router in 306 Lab</h1>
    <form method="POST" action="/add">
    <input name="ip" placeholder="IP" required />
    <input name="username" placeholder="Username" required />
    <input name="password" placeholder="Password" required />
    <button type="submit">Add</button>
  </form>

  <ul>
    {% for comment in data %}
      <li>
        <a href="{{ url_for('router_detail', router_id=comment._id) }}">{{ comment.ip }}</a> - {{ comment.username }}
	       {{ comment.ip }} - {{ comment.username }}	 
         <form method="POST" action="{{ url_for('delete_comment') }}" style="display:inline">
           <input type="hidden" name="idx" value="{{ comment._id }}"> 
           <!-- loop.index0 is special jinjga2 character that is runned in the loop. start at 0 -->
           <button type="submit">Delete</button>
         </form>
      </li>
    {% endfor %}
  </ul>

</body>
</html>
